name: build

# Every toolchain this repo supports, on every push. The Linux build in
# particular is otherwise easy to break blind: development happens on Windows,
# where `pkg-config --exists sdl3` fails and Makefile.sdl3 cannot be run at all.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  linux-gcc:
    name: Linux (gcc, SDL3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        run: |
          sudo apt-get update
          # Prefer the distro package; build from source if this image does not
          # carry SDL3 yet.
          if ! sudo apt-get install -y libsdl3-dev; then
            echo "libsdl3-dev unavailable, building SDL3 from source"
            sudo apt-get install -y cmake build-essential ninja-build
            curl -fsSL -o /tmp/SDL3.tar.gz \
              https://github.com/libsdl-org/SDL/releases/download/release-3.4.12/SDL3-3.4.12.tar.gz
            tar -xf /tmp/SDL3.tar.gz -C /tmp
            # X11/Wayland/audio backends are off on purpose: CI only needs
            # headers and a linkable library. The job compiles SMACK and
            # smoke-tests it under SDL_VIDEODRIVER=dummy, so pulling in the full
            # X11 dev set (xcursor, xrandr, xi, ...) is just more to install and
            # more to break -- that is what failed the first run.
            cmake -S /tmp/SDL3-3.4.12 -B /tmp/sdl3-build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
              -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF \
              -DSDL_PIPEWIRE=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
            cmake --build /tmp/sdl3-build --parallel
            sudo cmake --install /tmp/sdl3-build
            sudo ldconfig
          fi
          pkg-config --modversion sdl3

      - name: Build (release)
        run: make -f Makefile.sdl3 -j"$(nproc)"

      - name: Build (debug)
        run: make -f Makefile.sdl3 debug -j"$(nproc)"

      - name: Smoke test
        run: |
          test -x run/smack
          # No IWAD here, so it must exit with the IWAD error rather than a
          # signal. A startup segfault would show up as an exit code >= 128.
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          set +e
          out=$(cd run && ./smack -nosound -nomusic 2>&1); rc=$?
          set -e
          echo "$out" | tail -5
          echo "exit=$rc"
          if [ "$rc" -ge 128 ]; then echo "crashed (signal)"; exit 1; fi

      - name: Source-list drift check
        shell: pwsh
        run: ./tools/check-sources.ps1

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL3 (VC devel)
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.12/SDL3-devel-3.4.12-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile sdl3.zip -UseBasicParsing
          Expand-Archive sdl3.zip -DestinationPath $env:RUNNER_TEMP -Force
          "SDL3_DIR=$env:RUNNER_TEMP\SDL3-3.4.12" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, and fail on any implicit declaration
        shell: cmd
        # C4013 is the warning for an implicitly declared function, which
        # returns int and so truncates a pointer under LLP64. It is deliberately
        # not suppressed -- see docs/LEGACY_FIXES.md 9.1.
        run: |
          nmake /f Makefile.msvc SDL3_DIR=%SDL3_DIR% > build.log 2>&1
          type build.log
          findstr /C:"warning C4013" build.log && exit 1 || exit 0

      - name: Artefacts present
        shell: pwsh
        run: |
          if (-not (Test-Path run\smack.exe)) { throw "no run\smack.exe" }
          if (-not (Test-Path run\ID0\smack.wad)) { throw "no run\ID0\smack.wad" }
          "ok"

  windows-mingw:
    name: Windows (mingw-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc
            unzip
            curl

      - name: Fetch SDL3 (VC devel -- the mingw build links straight at the DLL)
        run: |
          curl -fsSL -o sdl3.zip \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.12/SDL3-devel-3.4.12-VC.zip
          unzip -q sdl3.zip -d "$RUNNER_TEMP"

      - name: Build
        run: |
          SDL3_WIN=$(cygpath -m "$RUNNER_TEMP/SDL3-3.4.12")
          make -f Makefile.mingw -j"$(nproc)" CC=gcc SDL3_DIR="$SDL3_WIN"
          test -f run/smack.exe
